# ===================================================================
# 全国城市空气质量分析系统 —— Web 模块配置
# ===================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: air-quality-web

  # ---------- 数据源 ----------
  # 注意：本项目用的是【独立 MySQL 实例】（端口 3307），
  #       不是系统里的 MySQL 服务（3306）。启动方式见 run_mysql.ps1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/air_quality?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  # 静态资源（ECharts 与本项目前端都放在 static 下）
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0        # 开发期不缓存，改完刷新即可看到效果

# ---------- MyBatis ----------
mybatis:
  configuration:
    map-underscore-to-camel-case: true   # avg_aqi -> avgAqi 自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.gznu.air: DEBUG
